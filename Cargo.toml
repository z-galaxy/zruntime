[package]
name = "zruntime"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
description = "A simple single-threaded Rust async runtime"
repository = "https://github.com/z-galaxy/zruntime"
keywords = ["async", "runtime", "reactor", "single-threaded"]
categories = ["asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
]

[features]
default = ["runtime", "event", "tracing"]
# The runtime: `Runtime`, `LocalRuntime`, `SharedRuntime`, tasks, timers and I/O registrations.
runtime = ["dep:rustix", "dep:windows-sys"]
# `Event` and `EventListener`, which need no runtime.
event = []
# Logs through `tracing`; a build without it emits no log events.
tracing = ["dep:tracing"]
# Per-thread shared runtimes: `SharedRuntime::current()`, the free `block_on`, and the helper
# thread that keeps their work moving in between `block_on` calls.
helper = ["runtime"]

[dependencies]
tracing = { version = "0.1.44", optional = true }

[target."cfg(unix)".dependencies.rustix]
version = "1.1.5"
default-features = false
features = ["event", "pipe", "std"]
optional = true

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Networking_WinSock"]
optional = true

[target."cfg(windows)".dev-dependencies]
uds_windows = "1.2.1"

[dev-dependencies]
criterion = { version = "5.0.2", package = "codspeed-criterion-compat", features = ["async"] }
futures-lite = "2.6.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ntest = "0.9.5"
socket2 = { version = "0.6.5", features = ["all"] }

[profile.bench]
debug = true
strip = "none"

[lib]
bench = false

[[bench]]
name = "runtime"
harness = false
required-features = ["helper"]

[[bench]]
name = "connection"
harness = false
required-features = ["helper", "event"]

[[bench]]
name = "event"
harness = false
required-features = ["event"]
