[package]
name = "zruntime"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
description = "A simple single-threaded Rust async runtime"
repository = "https://github.com/z-galaxy/zruntime"
keywords = ["async", "runtime", "reactor", "single-threaded"]
categories = ["asynchronous"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
]

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1.44", optional = true }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["event", "pipe", "std"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[target."cfg(windows)".dev-dependencies]
uds_windows = "1.2.1"

[dev-dependencies]
event-listener = "5.4.2"
futures-lite = "2.6.1"
ntest = "0.9.5"
socket2 = { version = "0.6.5", features = ["all"] }
